<!doctype html><html><head><meta charset="utf-8"><title>SECUREOPS Admin</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#0D1117;--panel:#161B22;--border:#30363D;--text:#E6EDF3;--muted:#8B949E;--green:#00FF88;--cyan:#00D4FF;--warn:#FFB020;--red:#FF4D4F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:900;letter-spacing:2px;color:var(--green)}.wrap{padding:18px;display:grid;grid-template-columns:260px 1fr;gap:18px}.side,.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:14px}.tab{display:block;width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--border);background:#0B1118;color:var(--text);font-weight:800;text-align:left;cursor:pointer}.tab.active{border-color:var(--green);color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.item{background:#0B1118;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}input,select,textarea{width:100%;background:#0D1117;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;margin:5px 0}button{background:var(--green);border:0;border-radius:10px;color:#00130A;padding:10px 12px;font-weight:900;cursor:pointer;margin:4px}.secondary{background:var(--cyan)}.danger{background:var(--red);color:white}.warn{background:var(--warn)}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:4px 8px;border-radius:20px;border:1px solid var(--border);font-size:12px;color:var(--muted)}.all{color:var(--green)}.direct{color:var(--cyan)}.group{color:var(--warn)}pre{white-space:pre-wrap;color:var(--muted)}@media(max-width:800px){.wrap{grid-template-columns:1fr}}
</style></head><body><header><div><div class="brand">SECUREOPS ADMIN</div><div class="muted">Access, fleet, conversations and audit management</div></div><input id="token" style="max-width:320px" value="change-this-admin-token" placeholder="Admin token"></header><div class="wrap"><aside class="side"><button class="tab active" onclick="show('overview')">Overview</button><button class="tab" onclick="show('users')">Users</button><button class="tab" onclick="show('aircraft')">Aircraft</button><button class="tab" onclick="show('conversations')">Conversations</button><button class="tab" onclick="show('messages')">Messages Metadata</button><button class="tab" onclick="show('invites')">Invites</button><button class="tab" onclick="show('audit')">Audit Logs</button><button class="secondary" onclick="load()">Refresh</button></aside><main id="main"></main></div><script>
let state={};let current='overview';const api=(path,opts={})=>fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+document.getElementById('token').value,...(opts.headers||{})}}).then(r=>r.json());
async function load(){state=await api('/api/admin/state'); render();}
function show(s){current=s;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));[...document.querySelectorAll('.tab')].find(b=>b.textContent.toLowerCase().startsWith(s))?.classList.add('active');render();}
function main(html){document.getElementById('main').innerHTML=html}
function render(){ if(!state.users) return main('<div class="card">Click Refresh.</div>'); if(current==='overview') return overview(); if(current==='users') return users(); if(current==='aircraft') return aircraft(); if(current==='conversations') return conversations(); if(current==='messages') return messages(); if(current==='invites') return invites(); if(current==='audit') return audit();}
function overview(){main(`<div class="grid"><div class="card"><h2>Users</h2><h1>${state.users.length}</h1></div><div class="card"><h2>Aircraft</h2><h1>${state.aircraft.length}</h1></div><div class="card"><h2>Conversations</h2><h1>${state.conversations.length}</h1></div><div class="card"><h2>Messages</h2><h1>${state.messages.length}</h1></div></div>`)}
function users(){main(`<div class="card"><h2>Create User</h2><input id="udn" placeholder="Display name"><select id="urole"><option>crew</option><option>operations</option><option>maintenance</option><option>logistics</option><option>admin</option></select><button onclick="createUser()">Create</button></div>${state.users.map(u=>`<div class="item"><b>${u.displayName}</b> <span class="pill">${u.role}</span> <span class="pill">${u.status}</span><br><button class="danger" onclick="deactivateUser('${u.id}')">Deactivate</button></div>`).join('')}`)}
async function createUser(){await api('/api/admin/users',{method:'POST',body:JSON.stringify({displayName:udn.value,role:urole.value})});load()} async function deactivateUser(id){await api('/api/admin/users/'+id+'/deactivate',{method:'POST'});load()}
function aircraft(){main(`<div class="card"><h2>Add Aircraft</h2><div class="grid"><input id="atype" placeholder="Type e.g. S-92"><input id="atail" placeholder="Tail"><input id="atfh" placeholder="Total FH" type="number" step="0.1"><input id="asi" placeholder="Since Inspection" type="number" step="0.1"><input id="aint" placeholder="Interval" type="number" step="0.1"><input id="alabel" placeholder="Inspection Label"></div><button onclick="addAircraft()">Add Aircraft</button></div>${state.aircraft.map(a=>`<div class="item"><div class="row"><b>${a.type} - ${a.tail}</b><span class="pill">${a.status}</span><span class="pill">Remaining ${a.remaining.toFixed(1)}h</span></div><div class="grid"><input id="type-${a.id}" value="${a.type}"><input id="tail-${a.id}" value="${a.tail}"><select id="status-${a.id}"><option ${a.status==='Serviceable'?'selected':''}>Serviceable</option><option ${a.status==='Limited Serviceable'?'selected':''}>Limited Serviceable</option><option ${a.status==='AOG'?'selected':''}>AOG</option></select><input id="tfh-${a.id}" value="${a.totalFH}" type="number" step="0.1"><input id="si-${a.id}" value="${a.sinceInspection}" type="number" step="0.1"><input id="int-${a.id}" value="${a.interval}" type="number" step="0.1"><input id="label-${a.id}" value="${a.inspectionLabel||''}"></div><button onclick="saveAircraft('${a.id}')">Save</button><input id="fh-${a.id}" placeholder="Flight hours" type="number" step="0.1"><button class="secondary" onclick="addFlight('${a.id}')">Add Flight</button><button class="warn" onclick="resetInspection('${a.id}')">Reset Inspection</button></div>`).join('')}`)}
async function addAircraft(){await api('/api/admin/aircraft',{method:'POST',body:JSON.stringify({type:atype.value,tail:atail.value,totalFH:atfh.value,sinceInspection:asi.value,interval:aint.value,inspectionLabel:alabel.value})});load()} async function saveAircraft(id){await api('/api/admin/aircraft/'+id,{method:'PUT',body:JSON.stringify({type:el('type-'+id).value,tail:el('tail-'+id).value,status:el('status-'+id).value,totalFH:el('tfh-'+id).value,sinceInspection:el('si-'+id).value,interval:el('int-'+id).value,inspectionLabel:el('label-'+id).value})});load()} async function addFlight(id){await api('/api/admin/aircraft/'+id+'/flight',{method:'POST',body:JSON.stringify({flightHours:el('fh-'+id).value})});load()} async function resetInspection(id){await api('/api/admin/aircraft/'+id+'/inspection',{method:'POST',body:JSON.stringify({})});load()}
function conversations(){main(`<div class="card"><h2>Create Channel / Group Conversation</h2><input id="cname" placeholder="Channel name"><select id="cscope"><option value="group">Group</option><option value="all">All Personnel</option><option value="operations">Operations</option><option value="maintenance">Maintenance</option><option value="logistics">Logistics</option></select><div>${state.users.map(u=>`<label class="pill"><input type="checkbox" class="mem" value="${u.id}"> ${u.displayName}</label>`).join(' ')}</div><button onclick="createChannel()">Create</button></div>${state.conversations.map(c=>`<div class="item"><b>${c.name}</b> <span class="pill ${c.audience}">${c.audience.toUpperCase()}</span><div class="muted">${c.type} • participants: ${c.participantIds.map(id=>state.users.find(u=>u.id===id)?.displayName||id).join(', ')}</div></div>`).join('')}`)}
async function createChannel(){const memberIds=[...document.querySelectorAll('.mem:checked')].map(x=>x.value); await api('/api/admin/channels',{method:'POST',body:JSON.stringify({name:cname.value,scope:cscope.value,memberIds})}); load()}
function messages(){main(`<div class="card"><h2>Send Admin Message Metadata Test</h2><select id="conv">${state.conversations.map(c=>`<option value="${c.id}">${c.name} (${c.audience})</option>`).join('')}</select><textarea id="mbody" placeholder="Message body"></textarea><button onclick="sendMsg()">Send Message</button><p class="muted">Messages are tagged as DIRECT / GROUP / ALL based on conversation audience.</p></div>${state.messages.slice().reverse().map(m=>`<div class="item"><b>${m.senderName}</b> <span class="pill ${m.audience}">${m.audience.toUpperCase()}</span> <span class="pill">${m.kind}</span><div>${typeof m.body==='string'?m.body:JSON.stringify(m.body)}</div><div class="muted">Conversation: ${state.conversations.find(c=>c.id===m.conversationId)?.name||m.conversationId} • ${m.time}</div></div>`).join('')}`)}
async function sendMsg(){await api('/api/app/messages',{method:'POST',headers:{Authorization:'Bearer change-this-app-token'},body:JSON.stringify({conversationId:conv.value,senderId:'u-admin',kind:'text',body:mbody.value})});load()}
function invites(){main(`<div class="card"><h2>Invites</h2><button onclick="createInvite()">Create Invite</button></div>${state.invites.map(i=>`<div class="item"><b>${i.code}</b> <span class="pill">${i.role}</span> <span class="pill">${i.status}</span><button class="danger" onclick="revokeInvite('${i.id}')">Revoke</button></div>`).join('')}`)} async function createInvite(){await api('/api/admin/invites',{method:'POST',body:JSON.stringify({role:'crew'})});load()} async function revokeInvite(id){await api('/api/admin/invites/'+id+'/revoke',{method:'POST'});load()}
function audit(){main(state.auditLogs.map(a=>`<div class="item"><b>${a.action}</b> <span class="pill">${a.targetType}</span><div class="muted">${a.createdAt}</div><pre>${JSON.stringify(a.metadata,null,2)}</pre></div>`).join('')||'<div class="card">No audit logs yet.</div>')}
function el(id){return document.getElementById(id)}
load();
</script></body></html>
